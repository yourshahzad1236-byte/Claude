<text x="40" y="840" font-size="12.5" fill="#37474f">Rules: one evaluation per employee per probation period · Draft is visible only to the evaluator · approver on leave → acting-for person (HRD.ACTING_FOR, to be confirmed) ·</text>
<text x="40" y="856" font-size="12.5" fill="#c62828" font-weight="600">PROBATION_STATUS = 'C' (Confirmed) is written only at the HR step — it sets CONFIRMATION_DATE and starts incentives. Employee separates before HR completes → CANCELLED.</text>
